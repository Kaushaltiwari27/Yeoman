<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none" class="w-auto h-auto">
  <defs>
    <linearGradient id="yStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075EA8" />
      <stop offset="100%" stop-color="#063B63" />
    </linearGradient>
    <linearGradient id="yGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ED060" />
      <stop offset="100%" stop-color="#39B54A" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#075EA8" />
      <stop offset="100%" stop-color="#063B63" />
    </linearGradient>
  </defs>

  <!-- Stylized Emblem -->
  <g transform="translate(10, 5)">
    <!-- Left Arm & Stem of Y -->
    <path d="M 12 12 L 28 12 L 38 42 L 38 72 L 24 72 L 24 45 Z" fill="url(#yStem)" />
    
    <!-- Globe Circle inside Y fork -->
    <circle cx="56" cy="40" r="22" fill="url(#globeGrad)" />
    <!-- Globe grid lines -->
    <ellipse cx="56" cy="40" rx="14" ry="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 34 40 H 78" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" />
    <path d="M 37 30 Q 56 34 75 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" />
    <path d="M 37 50 Q 56 46 75 50" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Right Arm of Y forming dynamic Green Arrow / Circular Sweep -->
    <path d="M 40 38 L 52 14 L 66 14 L 52 40 Z" fill="url(#yGreen)" />
    <!-- Orbiting leaf ring -->
    <path d="M 34 52 C 34 68, 62 74, 72 58 C 74 54, 76 46, 76 44 C 74 48, 71 52, 66 56 C 56 64, 42 62, 38 52 Z" fill="#39B54A" />
    <path d="M 64 26 C 72 32, 76 40, 76 48 L 79 46 C 80 36, 74 27, 65 22 Z" fill="#4ED060" />
  </g>

  <!-- Typography -->
  <g transform="translate(100, 15)">
    <!-- Brand Wordmark -->
    <text x="0" y="36" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="1" fill="#FFFFFF">YEOMAN</text>
    <text x="168" y="36" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="1" fill="#39B54A">EXIM</text>
    
    <!-- Submark -->
    <text x="2" y="56" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-weight="700" font-size="12" letter-spacing="4.5" fill="#94A3B8">PRIVATE LIMITED</text>
  </g>
</svg>
